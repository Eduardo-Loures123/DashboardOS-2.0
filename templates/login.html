<!doctype html>
<html lang="pt-BR" data-user-key="login"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="csrf-token" content="{{csrf}}"><title>Entrar · DashboardOS</title><link rel="icon" href="data:,"><script src="/static/js/preferences.js"></script><link rel="stylesheet" href="/static/css/style.css"><link rel="stylesheet" href="/static/css/components.css"><link rel="stylesheet" href="/static/css/premium.css"></head>
<body class="login-page"><main class="login-card"><div class="login-mark" aria-hidden="true">D<span>OS</span></div><p class="eyebrow">WORKSPACE / 2.0</p><h1>Bem-vindo ao DashboardOS</h1><p class="muted">Entre para gerenciar. Explore no modo visitante.</p>
<form method="post" action="/login" id="login-form"><input type="hidden" name="csrf_token" value="{{csrf}}"><label>ID do usuário<input name="user_id" id="user-id" autocomplete="username" required maxlength="64" autofocus></label><label>Senha<div class="password-control"><input type="password" name="password" id="password" autocomplete="current-password" required maxlength="256"><button type="button" class="button secondary" id="toggle-password" aria-controls="password" aria-pressed="false">Mostrar</button></div></label><p id="login-error" class="form-error" role="alert">{{error or ''}}</p><button type="submit" class="button primary">Entrar</button></form>
<form method="post" action="/auth/guest" id="guest-form"><input type="hidden" name="csrf_token" value="{{csrf}}"><button type="submit" class="button secondary">Modo visitante</button></form>
{% if not has_admin %}<p class="setup-note">Primeiro acesso? Crie o administrador no terminal local:<code>python -m flask --app app criar-admin</code></p>{% endif %}
<small class="muted">DashboardOS 2.0 · Ambiente local</small></main><script src="/static/js/login.js"></script></body></html>
