{% extends 'base.html' %}{% block content %}<section class="panel table-panel"><div class="panel-heading"><div><p class="eyebrow">GERENCIAMENTO</p><div class="management-title"><h2 id="table-title">{{title}}</h2>{% if page=='vencimentos' %}<div class="deadline-switch" role="group" aria-label="Tipo de vencimento"><button type="button" data-deadline-type="acessos" aria-pressed="true"><span data-icon="acessos" aria-hidden="true"></span>Acessos</button><button type="button" data-deadline-type="os" aria-pressed="false"><span data-icon="ordens-servico" aria-hidden="true"></span>OS</button></div>{% endif %}</div></div><label class="search"><span data-icon="search" aria-hidden="true"></span><input type="search" id="search" disabled aria-label="Pesquisar registros" placeholder="Pesquisar registros…"></label></div><div id="expiry-summary" class="expiry-summary" hidden></div><div class="table-scroll" tabindex="0" aria-label="Tabela de registros"><table><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div><div class="pagination"><span id="record-count"></span><div><label>Por página <select id="page-size" disabled>{% for size in ([12,24,48] if page=='equipes' else [10,20,50]) %}<option>{{size}}</option>{% endfor %}</select></label><button class="icon-button" id="prev" disabled aria-label="Página anterior"><span data-icon="left" aria-hidden="true"></span></button><span id="page-number"></span><button class="icon-button" id="next" disabled aria-label="Próxima página"><span data-icon="right" aria-hidden="true"></span></button></div></div></section>{% endblock %}
