# Substitua __DOMAIN__ pelo seu domínio real antes de instalar.
log_format dashboardos '$remote_addr $request_method $uri $status $body_bytes_sent';
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name __DOMAIN__;
    client_max_body_size 256k;
    access_log /var/log/nginx/dashboardos.access.log dashboardos;
    error_log /var/log/nginx/dashboardos.error.log;
    location / {
        proxy_pass http://unix:/run/dashboardos/app.sock;
        proxy_set_header Host __DOMAIN__;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_read_timeout 125s;
    }
}
